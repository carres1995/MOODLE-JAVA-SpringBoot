spring.application.name=Hamilton

# Configuracion de la base de datos en memoria
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Swagger/OpenAPI should document only API endpoints under /api/**
springdoc.paths-to-match=/api/**
springdoc.swagger-ui.urls[0].name=API
springdoc.swagger-ui.urls[0].url=/v3/api-docs/api
